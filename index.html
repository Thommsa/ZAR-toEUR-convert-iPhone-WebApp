<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZAR ⇄ EUR</title>
<meta name="theme-color" content="#12213A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZAR⇄EUR">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{
    --ink:       #12213A;
    --panel:     #1B2E4D;
    --panel-2:   #24395c;
    --gold:      #D4A24C;
    --teal:      #4FA8A0;
    --text:      #EDEDE5;
    --text-mute: #93A0B4;
    --border:    #2E4470;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--ink);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(212,162,76,0.08), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(79,168,160,0.10), transparent 45%);
    color: var(--text);
    font-family: var(--sans);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100dvh;
    padding: 24px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }
  .card{
    width:100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 24px 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }

  .field{
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .field label{
    display:block;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-mute);
    margin-bottom: 6px;
  }
  .field-row{ display:flex; align-items:baseline; gap:10px; }
  .field-row .flag{ font-size: 20px; line-height:1; }
  .field input{
    flex:1;
    min-width:0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 28px;
    font-variant-numeric: tabular-nums;
  }
  .field input::placeholder{ color: #4a5b7a; }
  .field-eur input{ color: var(--gold); }
  .field input:focus{ color: var(--teal); }

  .swap-row{
    display:flex;
    align-items:center;
    justify-content:center;
    margin: 12px 0;
    position:relative;
    height: 52px;
  }
  .swap-row::before{
    content:"";
    position:absolute;
    left:0; right:0; top:50%;
    height:1px;
    background: var(--border);
  }
  .swap-btn{
    position:relative;
    z-index:1;
    width:48px;
    height:48px;
    border-radius:50%;
    border: 1.5px solid rgba(212,162,76,0.4);
    background: linear-gradient(160deg, #2c4266 0%, #1a2c48 100%);
    color: var(--gold);
    font-size: 22px;
    font-weight: 500;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:
      0 5px 14px rgba(0,0,0,0.5),
      0 2px 4px rgba(0,0,0,0.35),
      inset 0 1px 1px rgba(255,255,255,0.15),
      inset 0 -3px 6px rgba(0,0,0,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .swap-btn:active{
    transform: scale(0.9) rotate(180deg);
    box-shadow:
      0 1px 4px rgba(0,0,0,0.45),
      inset 0 3px 8px rgba(0,0,0,0.45);
  }

  .rate-pill{
    margin-top: 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--text-mute);
  }
  .rate-pill .rate-value{ color: var(--text); }

  .meta{
    margin-top: 12px;
    font-size: 11.5px;
    color: var(--text-mute);
    text-align:center;
    line-height:1.5;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 6px;
  }
  .status-dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--text-mute);
    flex-shrink:0;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  .status-dot.live{ background: var(--teal); box-shadow: 0 0 0 3px rgba(79,168,160,0.18); }
  .status-dot.cached{ background: var(--gold); box-shadow: 0 0 0 3px rgba(212,162,76,0.18); }
  .status-dot.offline{ background: #c47a6a; box-shadow: 0 0 0 3px rgba(196,122,106,0.18); }
</style>
</head>
<body>

<div class="card">
  <div class="field">
    <label for="zarInput">South African Rand</label>
    <div class="field-row">
      <span class="flag">🇿🇦</span>
      <input id="zarInput" inputmode="decimal" placeholder="0.00" autocomplete="off">
      <span>ZAR</span>
    </div>
  </div>

  <div class="swap-row">
    <button class="swap-btn" id="clearBtn" aria-label="Clear both fields" title="Clear">↺</button>
  </div>

  <div class="field field-eur">
    <label for="eurInput">Euro</label>
    <div class="field-row">
      <span class="flag">🇪🇺</span>
      <input id="eurInput" inputmode="decimal" placeholder="0.00" autocomplete="off">
      <span>EUR</span>
    </div>
  </div>

  <div class="rate-pill">
    <span>Rate</span>
    <span class="rate-value" id="rateValue">—</span>
  </div>

  <p class="meta" id="metaLine">
    <span class="status-dot" id="statusDot"></span>
    <span id="metaText">Checking…</span>
  </p>
</div>

<script src="app.js"></script>
</body>
</html>
